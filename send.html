  <script type="module">
    import { db } from "./js/firebase-config.js";
    import {
      addDoc,
      collection,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    const params = new URLSearchParams(window.location.search);
    const recipientUid = params.get("to");

    const statusEl = document.getElementById("status");
    const sendBtn = document.getElementById("sendBtn");
    const input = document.getElementById("messageInput");

    if (!recipientUid) {
      statusEl.textContent = "Invalid link: no recipient was found.";
      statusEl.classList.remove("hidden");
      statusEl.classList.add("border-red-500/30", "bg-red-500/10", "text-red-300");
      sendBtn.disabled = true;
    } else {
      sendBtn.addEventListener("click", async () => {
        const text = input.value.trim();

        if (!text) {
          statusEl.textContent = "Please write a message first.";
          statusEl.classList.remove("hidden");
          statusEl.classList.add("border-amber-500/30", "bg-amber-500/10", "text-amber-300");
          return;
        }

        try {
          sendBtn.disabled = true;
          sendBtn.textContent = "Sending...";
          statusEl.classList.add("hidden");

          await addDoc(collection(db, "messages"), {
            recipientUid,
            message: text,
            text,
            createdAt: serverTimestamp(),
            isAnonymous: true,
            senderName: "Anonymous",
            status: "new"
          });

          statusEl.textContent = "✨ Whisper sent successfully.";
          statusEl.classList.remove("hidden");
          statusEl.classList.add("border-emerald-500/30", "bg-emerald-500/10", "text-emerald-300");

          input.value = "";
        } catch (error) {
          console.error("Send whisper error:", error);

          statusEl.textContent = "Failed to send whisper. Please try again.";
          statusEl.classList.remove("hidden");
          statusEl.classList.add("border-red-500/30", "bg-red-500/10", "text-red-300");
        } finally {
          sendBtn.disabled = false;
          sendBtn.textContent = "Send Whisper";
        }
      });
    }
  </script>
