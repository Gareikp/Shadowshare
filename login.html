<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShadowShare | Sign In</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">
        <i class="fas fa-moon"></i>
        <span>ShadowShare</span>
      </div>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="signup.html" class="nav-btn">Cast Your Shadow</a>
      </div>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <h2>Sign In</h2>
      <p class="section-subtitle" style="text-align: center; margin-bottom: 1.5rem;">Access your Shadowbox and view your whispers.</p>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="shadow@shadowshare.site" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <div id="login-error" class="form-status error hidden"></div>
        <button type="submit" class="cta-btn primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
      </form>

      <p class="auth-redirect" style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        New to ShadowShare? <a href="signup.html" style="color: var(--accent-primary);">Cast Your Shadow</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
