<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send a Whisper | ShadowShare</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          },
          colors: {
            midnight: {
              900: '#0B0D17',
              800: '#121526',
              700: '#1A1E36',
              600: '#262B4C'
            }
          }
        }
      }
    }
  </script>
</head>

<body class="min-h-screen bg-midnight-900 text-white flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md bg-midnight-800 rounded-3xl border border-white/10 p-6 sm:p-8 shadow-2xl">
    <div class="text-center mb-6">
      <div class="mx-auto w-14 h-14 rounded-2xl bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center mb-4 shadow-lg">
        <i class="fas fa-moon text-xl"></i>
      </div>
      <h1 class="text-2xl font-extrabold">Send a Whisper</h1>
      <p class="mt-2 text-sm text-gray-400">Anonymous message to this Shadowbox</p>
    </div>

    <div
      id="status"
      class="mb-4 hidden rounded-xl border border-white/10 bg-midnight-900 px-3 py-2 text-center text-xs text-gray-300"
    ></div>

    <textarea
      id="messageInput"
      rows="5"
      class="w-full rounded-2xl border border-white/10 bg-midnight-900 text-gray-100 placeholder-gray-500 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500"
      placeholder="Write something honest..."
    ></textarea>

    <button
      id="sendBtn"
      type="button"
      class="mt-5 w-full bg-gradient-to-r from-purple-600 to-indigo-500 text-white font-semibold py-3 rounded-2xl shadow-lg transition hover:brightness-110 active:scale-[0.99]"
    >
      Send Whisper
    </button>
  </div>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import {
      addDoc,
      collection,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    const params = new URLSearchParams(window.location.search);
    const recipientUid = params.get("to");

    const statusEl = document.getElementById("status");
    const sendBtn = document.getElementById("sendBtn");
    const input = document.getElementById("messageInput");

    if (!recipientUid) {
      statusEl.textContent = "Invalid link: no recipient was found.";
      statusEl.classList.remove("hidden");
      statusEl.classList.add("border-red-500/30", "bg-red-500/10", "text-red-300");
      sendBtn.disabled = true;
      return;
    }

    sendBtn.addEventListener("click", async () => {
      const text = input.value.trim();

      if (!text) {
        statusEl.textContent = "Please write a message first.";
        statusEl.classList.remove("hidden");
        statusEl.classList.add("border-amber-500/30", "bg-amber-500/10", "text-amber-300");
        return;
      }

      try {
        sendBtn.disabled = true;
        sendBtn.textContent = "Sending...";

        await addDoc(collection(db, "messages"), {
          recipientUid,
          message: text,
          text,
          createdAt: serverTimestamp(),
          isAnonymous: true,
          senderName: "Anonymous",
          status: "new"
        });

        statusEl.textContent = "✨ Whisper sent successfully.";
        statusEl.classList.remove("hidden");
        statusEl.classList.add("border-emerald-500/30", "bg-emerald-500/10", "text-emerald-300");

        input.value = "";
      } catch (error) {
        console.error("Send whisper error:", error);

        statusEl.textContent = "Failed to send whisper. Please try again.";
        statusEl.classList.remove("hidden");
        statusEl.classList.add("border-red-500/30", "bg-red-500/10", "text-red-300");
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "Send Whisper";
      }
    });
  </script>
</body>
</html>
