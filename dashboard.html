<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShadowShare | Your Shadowbox</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">
        <i class="fas fa-moon"></i>
        <span>ShadowShare</span>
      </div>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html" class="active">Shadowbox</a>
        <a href="#" id="logout-btn">Sign Out</a>
      </div>
    </div>
  </nav>

  <main class="section">
    <div class="container">
      <div class="dashboard-grid">
        
        <aside class="dashboard-sidebar">
          <h3>Your Shadow Link</h3>
          <p class="section-subtitle" style="font-size: 0.95rem; text-align: left; margin-bottom: 1rem;">
            Share this link with friends or on social media to receive whispers from ghosts.
          </p>
          
          <div class="link-demo" style="width: 100%; margin-bottom: 1.5rem;">
            <code id="shadow-link-display">Loading link...</code>
            <button class="copy-btn" id="copyShadowLink" type="button">
              <i class="fas fa-copy"></i> Copy
            </button>
          </div>
        </aside>

        <section class="dashboard-main">
          <h2>Your Shadowbox</h2>
          <p class="section-subtitle" style="text-align: left; font-size: 1rem;">
            Incoming whispers from the shadows will land here.
          </p>

          <div id="loading-text" class="form-status">Opening your Shadowbox...</div>
          <div id="messages-container"></div>
        </section>

      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="copyright">&copy; <span id="current-year">2026</span> ShadowShare. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/messages.js"></script>
</body>
</html>
