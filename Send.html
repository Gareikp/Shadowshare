<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send an Anonymous Whisper | ShadowShare</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            midnight: {
              900: '#0B0D17',
              800: '#121526',
              700: '#1A1E36',
              600: '#262B4C',
            },
            purpleGlow: '#8B5CF6',
            cyanGlow: '#06B6D4',
          },
          boxShadow: {
            'glow-purple': '0 0 25px -5px rgba(139, 92, 246, 0.4)',
            'glow-btn': '0 0 20px rgba(139, 92, 246, 0.5)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0B0D17;
      color: #F3F4F6;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    .text-gradient {
      background: linear-gradient(135deg, #A78BFA 0%, #38BDF8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .btn-gradient {
      background: linear-gradient(135deg, #7C3AED 0%, #2563EB 100%);
      transition: all 0.3s ease;
    }
    .btn-gradient:hover {
      background: linear-gradient(135deg, #6D28D9 0%, #1D4ED8 100%);
      box-shadow: 0 0 25px rgba(124, 58, 237, 0.6);
      transform: translateY(-1px);
    }
  </style>
</head>
<body class="bg-midnight-900 text-gray-100 min-h-screen flex flex-col justify-between selection:bg-purpleGlow selection:text-white">

  <!-- NAVBAR -->
  <nav class="sticky top-0 z-50 bg-midnight-900/80 backdrop-blur-md border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-2.5 group">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center shadow-glow-purple group-hover:scale-105 transition-transform">
            <i class="fas fa-moon text-white text-lg"></i>
          </div>
          <span class="font-bold text-xl tracking-tight text-white group-hover:text-purple-300 transition-colors">ShadowShare</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="flex-grow py-12 px-4 sm:px-6 flex items-center justify-center">
    <div class="max-w-md w-full space-y-6">

      <div class="text-center">
        <h1 class="text-3xl font-extrabold text-white mb-2">
          Send a <span class="text-gradient">Whisper</span>
        </h1>
        <p class="text-xs sm:text-sm text-gray-400">Your message is completely anonymous. Drop your note below.</p>
      </div>

      <div class="bg-midnight-800/80 backdrop-blur-md p-6 sm:p-8 rounded-3xl border border-white/10 shadow-xl relative overflow-hidden">
        <div class="absolute -right-10 -top-10 w-32 h-32 bg-purple-600/10 rounded-full blur-2xl pointer-events-none"></div>
        
        <form id="send-form" class="space-y-4">
          <div>
            <label for="message-input" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Your Secret Message</label>
            <textarea id="message-input" rows="4" required placeholder="Type your anonymous whisper here..." class="w-full bg-midnight-900 border border-white/10 focus:border-purple-500 rounded-2xl p-4 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500/25 transition-all resize-none shadow-inner"></textarea>
          </div>

          <button type="submit" id="submit-btn" class="w-full btn-gradient text-white font-semibold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 shadow-glow-btn text-sm">
            <i class="fas fa-paper-plane"></i>
            <span id="btn-text">Send Whisper</span>
          </button>
        </form>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-midnight-900 border-t border-white/10 py-6 text-center">
    <p class="text-xs text-gray-500">&copy; <span id="current-year">2026</span> ShadowShare. All rights reserved.</p>
  </footer>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 pointer-events-none bg-midnight-800 border border-purple-500/50 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 z-50 transition-all duration-300">
    <div class="w-7 h-7 rounded-full bg-purple-500/20 text-purple-400 flex items-center justify-center text-xs">
      <i class="fas fa-check"></i>
    </div>
    <span class="text-xs sm:text-sm font-medium">Whisper sent successfully into the shadows!</span>
  </div>

  <script>
    document.getElementById('current-year').textContent = new Date().getFullYear();
  </script>

  <!-- Sender Logic Script with Cache-Buster -->
  <script type="module" src="./js/send.js?v=20261024"></script>
</body>
</html>
