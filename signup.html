<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | ShadowShare</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/firebase.js"></script>
</head>
<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <i class="fas fa-moon"></i>
        <span>ShadowShare</span>
      </div>

      <h1>Create your account</h1>
      <p class="auth-subtitle">Start receiving honest anonymous messages from your circle.</p>

      <form id="signup-form" class="auth-form">
        <label for="displayName">Display name</label>
        <input id="displayName" name="displayName" type="text" placeholder="Your name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>

        <label for="username">Shadow username</label>
        <input id="username" name="username" type="text" placeholder="your-shadow-name" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="At least 6 characters" required>

        <button type="submit" class="cta-btn primary auth-btn">Create account</button>
      </form>

      <p class="auth-meta">Already have an account? <a href="login.html">Log in</a></p>
      <p id="auth-message" class="auth-message"></p>
    </div>
  </div>
</body>
</html>
