<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShadowShare | Drop a Whisper</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">
        <i class="fas fa-moon"></i>
        <span>ShadowShare</span>
      </div>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html">Sign In</a>
      </div>
    </div>
  </nav>

  <main class="message-page">
    <div class="message-card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <i class="fas fa-comment-dots" style="font-size: 2.5rem; color: var(--accent-primary); margin-bottom: 0.5rem;"></i>
        <h2>Drop a Whisper</h2>
        <p class="section-subtitle" style="font-size: 1rem; margin-bottom: 0;">
          Send an anonymous whisper. They will never know which ghost sent it.
        </p>
      </div>

      <form id="shadowForm" class="shadow-form">
        <textarea 
          id="whisperText" 
          placeholder="Drop a whisper... they will never know who said it." 
          maxlength="300"
          required
        ></textarea>

        <div id="veilNotice" class="form-status error hidden" style="font-size: 0.9rem;">
          Your whisper is reaching the veil.
        </div>

        <button type="submit" class="cta-btn primary" style="width: 100%; max-width: 100%;">
          <i class="fas fa-paper-plane"></i>
          <span>Drop a Whisper</span>
        </button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="copyright">&copy; <span id="current-year">2026</span> ShadowShare. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/messages.js"></script>
</body>
</html>
